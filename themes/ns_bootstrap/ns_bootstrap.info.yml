core_version_requirement: ^10.3 || ^11
type: theme
base theme: bootstrap

name: 'NatureSpot Bootstrap'
description: 'SASS + Boostrap theme for NatureSpot.'
package: 'Bootstrap'
version: '1.0.0'

regions:
  navigation: 'Navigation'
  navigation_collapsible: 'Navigation (Collapsible)'
  header: 'Header'
  menu: 'Menu bar'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'

dependencies:
  - iform

libraries:
  - 'ns_bootstrap/ns-scripts'
  - 'iform/fancybox'

libraries-extend:
  bootstrap/framework:
    - ns_bootstrap/framework

entity_print:
  node:
    certificate: 'ns_bootstrap/certificate-pdf'

